# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: harness-dev-context
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

# Native management supplies official bundles, component controls and config pages.
- id: plugin-manager
  disabled: false

- id: tool-plugin-manager
  disabled: true

- id: ui-plugin-manager
  disabled: false


- id: workspace
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: desktop-workspace-editor
      name: '@deepseek-ai/dsh-desktop-host'

    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
